<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get RightSteps</title>
<meta name="description" content="Download RightSteps: Sharpen Your Mind for iPhone.">
<meta property="og:title" content="RightSteps: Sharpen Your Mind">
<meta property="og:description" content="Download RightSteps for iPhone.">
<style>
  :root { --bg:#fff; --fg:#111; --muted:#666; --btn:#111; --btnfg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#f2f2f2; --muted:#aaa; --btn:#f2f2f2; --btnfg:#111; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.4 -apple-system, system-ui, sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 16px; }
  h1 { font-size:24px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 20px; }
  a.btn { display:inline-block; background:var(--btn); color:var(--btnfg); padding:14px 24px; border-radius:12px;
          text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>RightSteps</h1>
  <p id="msg">Taking you to the download…</p>
  <a class="btn" id="go" href="https://testflight.apple.com/join/nu6vr3uT">Download for iPhone</a>
</main>
<script>
// ── The only settings you ever need to touch ─────────────────────────────
// OVERRIDE: put any URL here to force every visitor there (leave "" for automatic).
var OVERRIDE = "";
var APP_STORE_ID = "6819920939";
var TESTFLIGHT = "https://testflight.apple.com/join/nu6vr3uT";
// ─────────────────────────────────────────────────────────────────────────
// Automatic mode: if the app is live on the App Store, go there; otherwise TestFlight.
var APP_STORE = "https://apps.apple.com/app/id" + APP_STORE_ID;
var DB = "https://jkdaukqdbzslvcasvzxo.supabase.co", KEY = "sb_publishable_WJurDMhkgkIoFdoM1w7dFA_tuC3XJSn";
var done = false;

// ── Click tracking (anonymous): where they came from, where we sent them ──
// Tag a link with ?s=name (e.g. /get/?s=tiktok) to count it separately; otherwise the
// source is detected from Instagram / Facebook / TikTok in-app browsers or the referrer.
var ua = navigator.userAgent;
var platform = /Android/i.test(ua) ? "android" : /iPhone|iPad|iPod/i.test(ua) ? "ios" : "desktop";
function source() {
  var tag = new URLSearchParams(location.search).get("s");
  if (tag) return tag;
  if (/Instagram/i.test(ua)) return "instagram";
  if (/FBAN|FBAV|FB_IAB/i.test(ua)) return "facebook";
  if (/musical_ly|BytedanceWebview|TikTok/i.test(ua)) return "tiktok";
  var r = document.referrer;
  if (/instagram\./i.test(r)) return "instagram";
  if (/facebook\.|fb\.me/i.test(r)) return "facebook";
  if (/tiktok\./i.test(r)) return "tiktok";
  return r ? (r.split("/")[2] || "direct").replace(/^www\./, "") : "direct";
}
function visitor() {
  try {
    var v = localStorage.getItem("rs_visitor");
    if (!v) { v = crypto.randomUUID(); localStorage.setItem("rs_visitor", v); }
    return v;
  } catch (e) { return crypto.randomUUID ? crypto.randomUUID() : null; }
}
function track(dest) {
  try {
    var body = JSON.stringify({ p_visitor: visitor(), p_src: source(), p_dest: dest, p_platform: platform,
      p_referrer: document.referrer ? document.referrer.split("/")[2] : null });
    // keepalive lets the request finish even though we navigate away right after.
    return fetch(DB + "/rest/v1/rpc/log_link_click", { method: "POST", keepalive: true, body: body,
      headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" } }).catch(function () {});
  } catch (e) { return Promise.resolve(); }
}

function go(url) {
  if (done) return; done = true;
  document.getElementById("go").href = url;
  var dest = url === OVERRIDE ? "override" : url === APP_STORE ? "app_store" : "testflight";
  if (platform === "android") {
    track("android_notice");
    document.getElementById("msg").textContent = "RightSteps is on iPhone for now. Open this link on an iPhone to download.";
    return;
  }
  // Give the click log a moment, but never hold the visitor up for more than 400ms.
  var t = track(dest), left = false;
  function leave() { if (!left) { left = true; location.replace(url); } }
  Promise.resolve(t).then(leave); setTimeout(leave, 400);
}
if (OVERRIDE) {
  go(OVERRIDE);
} else {
  // iTunes lookup supports JSONP, so this works from a static page.
  window.rsLookup = function (r) { go(r && r.resultCount > 0 ? APP_STORE : TESTFLIGHT); };
  var s = document.createElement("script");
  s.src = "https://itunes.apple.com/lookup?id=" + APP_STORE_ID + "&country=us&callback=rsLookup&t=" + Date.now();
  s.onerror = function () { go(TESTFLIGHT); };
  document.head.appendChild(s);
  setTimeout(function () { go(TESTFLIGHT); }, 2500);
}
</script>
</body>
</html>
