<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RightSteps TikTok</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#666; --box:#f2f2f2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#f2f2f2; --muted:#aaa; --box:#222; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.45 -apple-system, system-ui, sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:0 16px; }
  main { max-width:520px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:var(--muted); }
  code { display:block; background:var(--box); padding:12px; border-radius:10px; word-break:break-all; color:var(--fg); }
  button { margin-top:12px; padding:12px 18px; border-radius:10px; border:0; font-weight:600; background:var(--fg); color:var(--bg); }
</style>
</head>
<body>
<main>
  <h1 id="h">Connecting TikTok…</h1>
  <p id="p"></p>
  <code id="c" hidden>node backend/tools/tiktok.mjs connect</code>
  <button id="b" hidden>Copy again</button>
</main>
<script>
// TikTok Login Kit redirect for the RightSteps posting tool. The one-time code is handed to
// backend/tools/tiktok.mjs on Gabe's Mac via the clipboard; nothing is sent anywhere from here.
var q = new URLSearchParams(location.search), code = q.get("code"), err = q.get("error");
var h = document.getElementById("h"), p = document.getElementById("p");
if (err) { h.textContent = "TikTok didn't connect"; p.textContent = q.get("error_description") || err; }
else if (!code) { h.textContent = "Nothing to do here"; p.textContent = "This page finishes connecting RightSteps to TikTok."; }
else {
  var payload = JSON.stringify({ code: code, state: q.get("state") });
  function copy() { return navigator.clipboard.writeText(payload); }
  document.getElementById("b").onclick = function () { copy().then(function () { p.textContent = "Copied. Now run this on the Mac:"; }); };
  document.getElementById("b").hidden = false;
  document.getElementById("c").hidden = false;
  h.textContent = "Almost done";
  copy().then(function () { p.textContent = "The connection code is copied. Now run this on the Mac (within 5 minutes):"; },
              function () { p.textContent = "Tap “Copy again”, then run this on the Mac (within 5 minutes):"; });
  history.replaceState(null, "", location.pathname);
}
</script>
</body>
</html>
